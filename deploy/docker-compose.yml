# Jev Agent Routing - docker-compose.yml
# 用法：docker compose up -d

version: "3.8"

services:
  jev-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: jev-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JEV_API_KEY=${JEV_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 反向代理（可选，如果服务器已有 Nginx 可以不用）
  nginx:
    image: nginx:alpine
    container_name: jev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - jev-web
    profiles:
      - with-proxy  # 只有需要内置反代时才启动：docker compose --profile with-proxy up -d
