server {
    listen 80;
    server_name taoxie.vip www.taoxie.vip;

    # Let's Encrypt 续期校验（HTTP-01）必须走 80，且不能被跳转拦截
    location /.well-known/acme-challenge/ {
        root /home/ubuntu/personal-portfolio/dist;
    }

    # 其余全部跳转到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name taoxie.vip www.taoxie.vip;

    ssl_certificate     /etc/letsencrypt/live/taoxie.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taoxie.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /home/ubuntu/personal-portfolio/dist;
    index index.html;

    # AI 每日简报后端（只读服务，端口 8089）
    # 将本片段加入 taoxie.vip 的 443 server 块中（Atoms Native 子路径部署）
    # 数字分身陪伴 WebApp（后端 8090，静态子路径）
    location = /digital-avatar { return 301 /digital-avatar/; }
    location /digital-avatar/api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /digital-avatar/socket.io/ {
        proxy_pass http://127.0.0.1:8090/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    location /digital-avatar/ {
        alias /home/ubuntu/digital-avatar/client/dist/;
        try_files $uri $uri/ /digital-avatar/index.html;
    }

    # digital-avatar-perf: 静态资源缓存（assets 永久 immutable / models 7天），index.html 不缓存
    location ^~ /digital-avatar/assets/ {
        alias /home/ubuntu/digital-avatar/client/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location ^~ /digital-avatar/models/ {
        alias /home/ubuntu/digital-avatar/client/dist/models/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /digital-avatar/index.html {
        alias /home/ubuntu/digital-avatar/client/dist/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /atoms-native { return 301 /atoms-native/; }
    location /atoms-native/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 关键：关闭代理缓冲
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /api/aihot/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 刷题教练 API（端口 8077）：/api/* 统一反代到后端
    # 注意：proxy_pass 末尾不带 /，保留 /api 前缀（后端路由为 /api/...）
    location /api/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 刷题教练 反代（旧 /coach/ 入口保留）
    location /coach/ {
        proxy_pass http://127.0.0.1:8077/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /coach {
        return 301 /coach/;
    }

    # ============================================================
    # eufy 黑客松 demo 聚合入口 · nginx 片段
    # ============================================================

    location = /eufy-demo { return 301 /eufy-demo/; }

    # ---- 摄像头 Agent API（SSE：必须关缓冲 + 拉长超时）----
    location ^~ /eufy-demo/next/api/ {
        proxy_pass http://127.0.0.1:8111/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ---- cn 轻量后端 API 反代（server.py -> 127.0.0.1:8113）----
    location ^~ /eufy-demo/cn/api/ {
        proxy_pass http://127.0.0.1:8113;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- backend 轻量后端 API+静态 反代（server.py -> 127.0.0.1:8114）----
    location ^~ /eufy-demo/backend/ {
        proxy_pass http://127.0.0.1:8114;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /eufy-demo/ {
        root /var/www;
        try_files $uri $uri/ =404;
    }

    location ^~ /eufy/ {
        root /var/www;
        try_files $uri $uri/ /eufy/index.html;
    }

    # ============================================================
    # Jev Agent Routing Demo (端口 8888)
    # ============================================================
    location = /jev { return 301 /jev/; }
    location /jev/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 全站 HSTS（强化安全）
    add_header Strict-Transport-Security "max-age=31536000" always;
}
