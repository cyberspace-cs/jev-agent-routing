<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信 - Jev 低情商救星</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #d9d9d9;
            height: 100vh;
            display: flex;
            justify-content: center;
        }
        .phone {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #ededed;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* 状态栏 */
        .status-bar {
            height: 24px;
            background: #ededed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            font-weight: 600;
            color: #000;
        }
        /* 导航栏 */
        .nav-bar {
            height: 44px;
            background: #ededed;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 0.5px solid #d9d9d9;
        }
        .nav-bar .title {
            font-size: 17px;
            font-weight: 600;
        }
        .nav-bar .back {
            position: absolute;
            left: 12px;
            font-size: 20px;
            color: #000;
        }
        .nav-bar .more {
            position: absolute;
            right: 16px;
            font-size: 20px;
            color: #000;
            letter-spacing: 2px;
        }
        /* 聊天区 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* 消息行 */
        .msg-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .msg-row.left {
            flex-direction: row;
        }
        .msg-row.right {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            flex-shrink: 0;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .msg-content {
            max-width: 70%;
        }
        .bubble {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }
        .msg-row.left .bubble {
            background: #fff;
            color: #000;
        }
        .msg-row.right .bubble {
            background: #95ec69;
            color: #000;
        }
        /* Jev 分析卡片 */
        .jev-card {
            max-width: 75%;
            background: #f2f2f2;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
            margin: 4px 0 0 46px;
        }
        .jev-card .jev-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a1a1a;
        }
        .jev-card .jev-line {
            margin: 2px 0;
        }
        .jev-card .jev-highlight {
            color: #e64340;
            font-weight: 600;
        }
        .jev-card .jev-suggestion {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 0.5px solid #ddd;
            color: #1a1a1a;
            font-weight: 500;
        }
        /* 输入栏 */
        .input-bar {
            height: 56px;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
            border-top: 0.5px solid #d9d9d9;
        }
        .input-bar .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .input-bar input {
            flex: 1;
            height: 38px;
            border: none;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 16px;
            outline: none;
            background: #fff;
        }
        .send-btn {
            padding: 8px 16px;
            background: #07c160;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
        }
        .send-btn:active {
            background: #06ad56;
        }
        /* 打字中 */
        .typing {
            font-size: 13px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="phone">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>18:01</span>
            <span>📶 📡 🔋</span>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <span class="back">‹</span>
            <span class="title">老板</span>
            <span class="more">···</span>
        </div>

        <!-- 聊天区 -->
        <div class="chat-area" id="chatArea">
            <!-- 初始消息 -->
            <div class="msg-row left">
                <div class="avatar">👨‍💼</div>
                <div class="msg-content">
                    <div class="bubble">在吗？有个小需求。</div>
                </div>
            </div>

            <div class="jev-card">
                <div class="jev-title">Jev：</div>
                <div class="jev-line">"小需求"真的小吗？</div>
                <div class="jev-line">- 是：<span class="jev-highlight">2%</span></div>
                <div class="jev-line">- 否：98%</div>
                <div class="jev-line">预计影响</div>
                <div class="jev-line">- 改个颜色：3%</div>
                <div class="jev-line">- 重写半个项目：97%</div>
                <div class="jev-line">危险等级：<span class="jev-highlight">9 / 10</span></div>
                <div class="jev-suggestion">建议动作：先问清楚是什么需求，别说"好的"。</div>
            </div>

            <div class="msg-row right">
                <div class="avatar">😺</div>
                <div class="msg-content">
                    <div class="bubble">在的，您说。</div>
                </div>
            </div>
        </div>

        <!-- 输入栏 -->
        <div class="input-bar">
            <div class="icon-btn">🎤</div>
            <input type="text" id="inputMsg" placeholder="">
            <div class="icon-btn">😊</div>
            <div class="icon-btn">➕</div>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const inputMsg = document.getElementById('inputMsg');

        // 模拟 Jev 分析
        async function analyzeWithJev(message, recipient = "老板") {
            try {
                const resp = await fetch('/api/wechat-polish', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message: message,
                        recipient: recipient
                    })
                });
                return await resp.json();
            } catch (e) {
                // 本地 mock，离线也能演示
                return {
                    too_rude: Math.random() * 0.5,
                    risk_level: ['safe', 'slightly_risky', 'risky', 'very_risky'][Math.floor(Math.random() * 3)],
                    appropriateness: ['perfect', 'ok', 'needs_polish', 'dont_send'][Math.floor(Math.random() * 3)],
                    should_send: true,
                    feedback: "（本地演示模式）"
                };
            }
        }

        function addLeftMessage(text) {
            const html = `
                <div class="msg-row left">
                    <div class="avatar">👨‍💼</div>
                    <div class="msg-content">
                        <div class="bubble">${text}</div>
                    </div>
                </div>
            `;
            chatArea.insertAdjacentHTML('beforeend', html);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addRightMessage(text) {
            const html = `
                <div class="msg-row right">
                    <div class="avatar">😺</div>
                    <div class="msg-content">
                        <div class="bubble">${text}</div>
                    </div>
                </div>
            `;
            chatArea.insertAdjacentHTML('beforeend', html);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addJevCard(analysis) {
            const riskEmoji = analysis.risk_level === 'safe' ? '🟢' :
                             analysis.risk_level === 'slightly_risky' ? '🟡' :
                             analysis.risk_level === 'risky' ? '🟠' : '🔴';

            const html = `
                <div class="jev-card">
                    <div class="jev-title">Jev：</div>
                    <div class="jev-line">语气冲吗？</div>
                    <div class="jev-line">- 不冲：${((1 - analysis.too_rude) * 100).toFixed(0)}%</div>
                    <div class="jev-line">- 有点冲：<span class="${analysis.too_rude > 0.6 ? 'jev-highlight' : ''}">${(analysis.too_rude * 100).toFixed(0)}%</span></div>
                    <div class="jev-line">风险等级：${riskEmoji} ${analysis.risk_level}</div>
                    <div class="jev-line">合适程度：${analysis.appropriateness}</div>
                    <div class="jev-suggestion">建议：${analysis.feedback}</div>
                </div>
            `;
            chatArea.insertAdjacentHTML('beforeend', html);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addTyping() {
            const html = `<div class="typing">Jev 正在分析...</div>`;
            chatArea.insertAdjacentHTML('beforeend', html);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTyping() {
            const typing = chatArea.querySelector('.typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const text = inputMsg.value.trim();
            if (!text) return;

            inputMsg.value = '';

            // 1. 先显示我的消息
            addRightMessage(text);

            // 2. Jev 分析
            addTyping();
            const analysis = await analyzeWithJev(text);
            removeTyping();
            addJevCard(analysis);
        }

        // 回车发送
        inputMsg.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 自动聚焦
        inputMsg.focus();
    </script>
</body>
</html>
